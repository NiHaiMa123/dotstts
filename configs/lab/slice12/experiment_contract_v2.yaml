schema_version: 2
experiment_id: slice12_fuxuan_formal_v2

dataset:
  dataset_id: fuxuan
  dataset_version: 1
  frozen_tree_sha256: 77754574c4048a20682b0e8f9be95c322cf0848afedaf90d7c81b1f00df029af
  train_manifest: datasets/fuxuan/v1/train.jsonl
  validation_manifest: datasets/fuxuan/v1/validation.jsonl
  test_manifest: datasets/fuxuan/v1/test.jsonl
  source_manifest: data/references/fuxuan/v1/manifest.json
  source_manifest_sha256: 1a33c738c1b807337b97eaed278aee05c1458aebc1f4d16da32ba7dee879c085
  reference_ranking: data/reports/datasets/fuxuan_v1/slice10/final_ranking.json
  approved_reference_count: 6

runtime:
  mode: docker_wsl2
  workspace_mount: /workspace
  dockerfile: docker/slice12/Dockerfile
  compose_file: docker/slice12/compose.yaml
  required_python_dependencies: [torch, torchaudio, transformers, accelerate, peft]
  optional_python_dependencies: [bitsandbytes, flash_attn]
  optional_dependency_policy: first_run_does_not_use_quantization_or_flash_attention

models:
  deployment_baseline:
    role: existing_inference_reference
    model_id: dots-studio/dots.tts-mf-1step
    revision: 4e872aa8f47ee67887468e7494e36aad30908b1e
    local_path: models/dots.tts-mf-1step
  training_control:
    role: untrained_same_family_control
    model_id: dots-studio/dots.tts-soar
    revision: 2f9b3e18d70d670d4c701da2dc55ded5755815ce
    local_path: pretrained_models/dots.tts-soar
  trained_candidate:
    role: soar_lora_finetune
    base: training_control
    adapter: lora
  common_inference:
    precision: bfloat16
    language: chinese
    speaker_scale: 1.5
    max_generate_length: 500
    max_sequence_length: 2048

training:
  method: lora
  target_scope: core.velocity_field_predictor
  target_modules: [q_proj, k_proj, v_proj, o_proj, fc1, fc2]
  rank: 8
  alpha: 16
  dropout: 0.05
  train_output_layer: true
  freeze: [core.llm, core.patch_encoder, vocoder, xvector_extractor]
  precision: bfloat16
  batch_size: 1
  gradient_accumulation_steps: 1
  use_gradient_checkpointing: true
  use_4bit_optimizer: false
  use_flash_attention: false

evaluation:
  sentences:
    - id: neutral_report
      text: 本座已经看过这份报告，结论相当明确。
      class: neutral
    - id: named_entity
      text: 请把列车长和将军的消息一并告诉我。
      class: named_entity
    - id: long_decision
      text: 天命不会替任何人做决定，关键在于当机立断。
      class: long
    - id: date_number
      text: 七月十五日，星穹列车将在长乐天停留三小时。
      class: date_number
    - id: short_ack
      text: 好的。
      class: short
    - id: out_of_domain
      text: 秋水共长天一色，落霞与孤鹜齐飞。
      class: reference_external_text
  coverage_note: emotion-controlled evaluation is a separate experiment because the basic pipeline has no emotion control input
  seeds: [20260908, 20260909]
  matrix_policy: each approved reference x each sentence x each seed
  aggregation:
    failure_rate: failed_items / expected_items
    cer: arithmetic_mean_over_successful_items
    speaker_cosine: arithmetic_mean_over_successful_items
    quality_pass_rate: pass_items / successful_items
    rtf: arithmetic_mean_over_successful_items
    inference_peak_cuda_gib: maximum_over_generation_jobs

metrics:
  asr_backend: faster_whisper
  speaker_similarity: cosine
  quality: signal_analysis_v1
  failure_statuses: [generation_error, invalid_audio, asr_error]
  candidate_absolute_gates:
    max_failure_rate: 0.05
    max_mean_cer: 0.20
    min_mean_speaker_cosine: 0.75
    min_quality_pass_rate: 0.50
    max_mean_rtf: 1.00
    max_inference_peak_cuda_gib: 12.0
    max_training_peak_cuda_gib: 15.0
  regression_gates_against_training_control:
    max_mean_cer_increase: 0.02
    max_mean_speaker_cosine_drop: 0.02
    max_quality_pass_rate_drop: 0.05
    max_mean_rtf_ratio: 1.15

outputs:
  root: data/reports/datasets/fuxuan_v1/slice12
  reference_manifest: data/reports/datasets/fuxuan_v1/slice12/baseline_manifest.jsonl
  container_manifest_root: data/work/slice12/container_manifests
  deployment_baseline_metrics: data/reports/datasets/fuxuan_v1/slice12/baseline_metrics.json
  training_control_generation: data/reports/datasets/fuxuan_v1/slice12/soar_control_generation.jsonl
  training_control_metrics: data/reports/datasets/fuxuan_v1/slice12/soar_control_metrics.json
  trained_generation: data/reports/datasets/fuxuan_v1/slice12/soar_lora_generation.jsonl
  trained_metrics: data/reports/datasets/fuxuan_v1/slice12/soar_lora_metrics.json
  regression_report: data/reports/datasets/fuxuan_v1/slice12/regression_report_v2.json
  preflight_report: data/reports/datasets/fuxuan_v1/slice12/preflight_v2.json
