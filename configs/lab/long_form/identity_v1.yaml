  model_id: dots-studio/dots.tts-mf-1step
  model_revision: 4e872aa8f47ee67887468e7494e36aad30908b1e
  weights_path: models/dots.tts-mf-1step/speaker_encoder.safetensors
  weights_sha256: 1cf3861c9dee79e4db34bd0b8a4155e68bed27a7c6274e168bb6ee4fed191c85
  model_config_path: models/dots.tts-mf-1step/config.json
  model_config_sha256: f3388119ec80a559013092e1875d9df8cda812bd4517476b5fc744d4e05c7785
  license: Apache-2.0
  input_sample_rate: 48000
  embedding_size: 512
  max_audio_seconds: 0.0
