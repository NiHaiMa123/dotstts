schema_version: 1
config_id: long_form_identity_v1
config_version: 1

# 说话人时间轴分析窗：1.5s 窗 / 0.75s hop；低于能量门限的窗不嵌入
windows:
  window_seconds: 1.5
  hop_seconds: 0.75
  min_window_rms_dbfs: -45.0
  min_voiced_windows_for_stability: 2

# 片内转折与原型匹配阈值（结构性证据，不是 pass 门限）
timeline:
  turn_change_cosine: 0.55
  prototype_match_cosine: 0.60
  min_turn_seconds: 1.5
  overlap_ambiguity_margin: 0.08

# 冻结参考包：score 只产出 cosine 统计，判定阈值未标定前由 gate 保持 unknown
targets:
  reference_pack_path: configs/lab/long_form/reference_pack_suisui_v1.yaml
  reference_pack_sha256: 0ea3fc6765bec50b7d0e2aa2076ca1421b68a0383dcee165e44292ab5cbe460a
  reference_audio_root: data/work/long_form/exports/suisui/v1
  max_reference_seconds: 10.0

# 与 training_source_v1.yaml 同一套钉死 CAM++
encoder:
