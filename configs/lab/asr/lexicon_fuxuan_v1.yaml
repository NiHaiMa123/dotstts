# recalled when it survives benchmark normalization as a contiguous substring of
# the backend hypothesis, so entries must be written exactly as the ground truth
# spells them. Character-level CER hides these misses: a two-character slip in a
# proper noun costs almost nothing on a 30-character line, yet it destroys the
# term that makes the line worth keeping as character corpus.
