[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dots.tts"
version = "0.3.1"
description = "dots.tts: a fully continuous autoregressive TTS system with SOAR alignment and CFG-aware MeanFlow distillation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "dots.tts Team" }]
keywords = [
    "text-to-speech",
    "tts",
    "speech-synthesis",
    "autoregressive",
    "flow-matching",
    "meanflow",
    "diffusion",
    "voice-cloning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "transformers>=4.57.0",
    "huggingface-hub",
    "loguru",
    "langcodes[data]",
    "gradio>=6.17,<7",
    "einops",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "numpy>=2.2.6",
    "scipy>=1.15",
    "soxr>=1.0,<2",
    "pyloudnorm>=0.2,<0.3",
    "pydantic>=2.12.5,<3",
    "pyarrow>=25.0.1,<26",
    "PyYAML>=6.0.3",
    "safetensors>=0.8.0rc0",
    "torchdiffeq",
    "tqdm",
    "lingua-language-detector",
    # Long-form prefilter (LF-12C): ONNX Silero VAD, loaded lazily.
    "silero-vad>=6.2,<7",
    # Long-form event evidence (LF-12E): PANNs CNN14 AudioSet tagger, loaded
    # lazily; model files live in ~/panns_data and are hash-pinned by config.
    "panns-inference>=0.1.1,<0.2",
    # Pynini, pulled in by WeTextProcessing, does not publish Windows wheels.
    # Text normalization is optional at runtime and is loaded lazily.
    "WeTextProcessing; platform_system != 'Windows'",
    # torch.compile (runtime optimize=True) needs Triton; upstream publishes no
    # Windows wheel, so use the matching community port on Windows only.
    "triton-windows>=3.4.0,<3.5; platform_system == 'Windows'",
]

[project.optional-dependencies]
edit_playground_asr = [
    "qwen-asr==0.0.6",
]
full = [
    "accelerate>=1.12.0",
    "peft>=0.20.0,<1",
    "tensorboard>=2.20.0",
    "ruff>=0.15.12",
]

[project.scripts]
"dots.tts" = "dots_tts.cli:main"
"dots.tts.edit" = "dots_tts.edit_cli:main"
"dots.tts.lab" = "dots_tts_lab.cli:main"

[project.urls]
Homepage = "https://github.com/studio-dots-ai/dots.tts"
Repository = "https://github.com/studio-dots-ai/dots.tts"
Issues = "https://github.com/studio-dots-ai/dots.tts/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dots_tts*"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["dots_tts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
